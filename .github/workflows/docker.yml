name: Docker

# 1.44: the Docker image, and proof that the dedicated install (install.sh) still works.
#   image    build the image, start it with MariaDB (compose.yaml), run tests/docker/smoke.py
#   install  install.sh in a Debian 13 VM (fresh, and the previous release updated to this code)
#   publish  on a release tag (v1.2.3): push ghcr.io/msp-align/msp-align:1.2.3, :1.2 and :latest (amd64 + arm64)
on:
  push:
    branches: [main, develop, docker]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build
        run: docker build -t msp-align:ci .
      - name: Start (compose.yaml)
        run: |
          cat >.env <<ENV
          ALIGN_URL=https://align.ci.example
          ALIGN_TZ=America/Los_Angeles
          ALIGN_ADMIN_EMAIL=admin@example.com
          ALIGN_ADMIN_PASSWORD=CiAdminPassword-$(openssl rand -hex 6)
          ALIGN_DB_PASSWORD=$(openssl rand -hex 24)
          ALIGN_PORT=8080
          ENV
          docker compose -f compose.yaml -f tests/docker/compose.ci.yaml up -d
          # a second, separate install to restore the first one's backup into (moving between servers)
          ALIGN_PORT=8081 ALIGN_SUBNET=172.30.58.0/24 docker compose -p msp-align2 -f compose.yaml -f tests/docker/compose.ci.yaml up -d
      - name: Smoke test
        run: |
          pip install -q requests
          set -a; . ./.env; set +a
          ALIGN_TEST_URL=http://127.0.0.1:8080 DC="docker compose -f compose.yaml -f tests/docker/compose.ci.yaml" \
          ALIGN_TEST_URL2=http://127.0.0.1:8081 DC2="docker compose -p msp-align2 -f compose.yaml -f tests/docker/compose.ci.yaml" \
            python3 tests/docker/smoke.py
      - name: HTTPS add-on config is valid
        run: docker compose -f compose.yaml -f compose.caddy.yaml config -q
      - name: Logs
        if: always()
        run: docker compose -f compose.yaml -f tests/docker/compose.ci.yaml logs --no-color app | tail -200

  install:
    name: Dedicated install (Debian 13 VM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Fresh install, and the previous release updated to this code
        run: tests/docker/install_test.sh

  publish:
    name: Publish to ghcr.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, install]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing of the image (Sigstore)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # the earlier release tags, for their key file
      # 2.0: a release is only published when its tag is signed with a release key (docs/RELEASING.md), checked the
      # way servers check it (scripts/release.sh) and against the key file of the release before it. This catches
      # mistakes, not an attacker: whoever can push tags or change this workflow can get past it. Dedicated servers
      # check the key themselves; for Docker, see docs/DOCKER.md.
      - name: Check the release tag is signed with the release key
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq openssh-client >/dev/null
          git fetch -q --force --tags origin
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)" || { echo "The tag has moved since this run started"; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME" || { echo "VERSION doesn't match the tag"; exit 1; }
          keys() { git show "$1:deploy/release-signers" 2>/dev/null | grep -qvE '^[[:space:]]*(#|$)'; }
          signers=""
          for t in $(git tag -l 'v*' --sort=-v:refname); do
            [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$t" != "$GITHUB_REF_NAME" ]] || continue
            [[ "$(printf '%s\n%s\n' "${t#v}" "${GITHUB_REF_NAME#v}" | sort -V | head -1)" == "${t#v}" ]] || continue
            if keys "$t"; then git show "$t:deploy/release-signers" > "$RUNNER_TEMP/signers"; signers="$RUNNER_TEMP/signers"; echo "Checking against the keys of $t"; break; fi
          done
          if [[ -z "$signers" ]] && keys HEAD; then
            cp deploy/release-signers "$RUNNER_TEMP/signers"; signers="$RUNNER_TEMP/signers"; echo "First signed release: checking against its own key file"
          fi
          if [[ -n "$signers" ]]; then
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then   # a pre-release (servers never take these): the signature only
              git -c gpg.ssh.program=ssh-keygen -c gpg.program=false -c gpg.ssh.allowedSignersFile="$signers" verify-tag "$GITHUB_REF_NAME"
            else
              bash scripts/release.sh "$PWD" "$signers" --head || { echo "The tag isn't signed with a release key"; exit 1; }
            fi
            echo "Signed release $GITHUB_REF_NAME"
          else
            echo "No release key yet: not checking the tag signature"
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/msp-align/msp-align
          # latest only for full releases (v2.0.0, not v2.0.0-beta.1)
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Keyless signature: proves the image was built by this repository's workflow from this tag (docs/DOCKER.md)
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/msp-align/msp-align@${{ steps.build.outputs.digest }}"
