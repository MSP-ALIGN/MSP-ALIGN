name: Docs

# Publishes the documentation site (mspalign.org) from README.md and docs/ on each push to main.
# One-time setup on GitHub: Settings -> Pages -> Source: GitHub Actions, Custom domain: mspalign.org, Enforce HTTPS.
on:
  push:
    branches: [main]
    paths: [README.md, VERSION, 'docs/**', 'tools/docs/**', 'src/Api/**', src/helpers.php, public/assets/icon.svg, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    container: debian:trixie   # the same PHP as a server: the REST API page is read from the API's own code
    steps:
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-markdown php-cli ca-certificates tar zstd >/dev/null
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build
        run: python3 tools/docs/build.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
