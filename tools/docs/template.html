<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{base}}<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://mspalign.org/brand/social.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0f2a4f">
<style>
:root {
  --bg: #ffffff; --panel: #f5f7fa; --text: #1f2933; --muted: #5f6b7a; --line: #e1e6ec;
  --accent: #1b68b8; --accent-soft: #e4edf6; --code-bg: #f1f3f6; --pre-bg: #0f1720; --pre-text: #e6edf3;
  --warn-bg: #fff8e1; --warn-line: #e0a800;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --panel: #151b23; --text: #e6edf3; --muted: #9aa5b1; --line: #2a323c;
    --accent: #6fb0ec; --accent-soft: #0f2238; --code-bg: #1c232c; --pre-bg: #0a0e13; --pre-text: #e6edf3;
    --warn-bg: #2a2412; --warn-line: #b38600;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 2; }
.brand { white-space: nowrap; display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 700; letter-spacing: .02em; }
/* 2.2.2: the MSP Align logo (mark and name), with light lettering in dark mode */
.brand img { height: 30px; width: auto; display: block; }
.brand .on-dark, .hero-logo .on-dark { display: none; }
@media (prefers-color-scheme: dark) { .brand .on-light, .hero-logo .on-light { display: none; } .brand .on-dark, .hero-logo .on-dark { display: block; } }
.hero-logo { margin: 8px 0 18px; }
.hero-logo img { width: min(460px, 100%); height: auto; border: 0; border-radius: 0; box-shadow: none; display: block; }
.brand:hover { text-decoration: none; }
.top .spacer { flex: 1; }
.top .gh { color: var(--muted); font-size: 14px; }
.top .suggest { white-space: nowrap; font-size: 14px; font-weight: 600; border: 1px solid var(--accent); border-radius: 999px; padding: 3px 12px; }
.top .suggest:hover { background: var(--accent-soft); text-decoration: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.button { display: inline-block; padding: 9px 18px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; }
.button:hover { text-decoration: none; filter: brightness(1.08); }
.button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.menu { display: none; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 14px; }
.wrap { display: grid; grid-template-columns: 230px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
nav.side { padding: 24px 16px; border-right: 1px solid var(--line); position: sticky; top: 53px; align-self: start; max-height: calc(100vh - 53px); overflow: auto; }
nav.side a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--muted); font-size: 15px; }
nav.side a:hover { background: var(--panel); color: var(--text); text-decoration: none; }
nav.side a[aria-current] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
main { padding: 32px 40px 64px; min-width: 0; }
main h1 { font-size: 2rem; line-height: 1.25; margin: 0 0 .6em; }
main h2 { font-size: 1.4rem; margin: 2em 0 .6em; padding-top: .4em; border-top: 1px solid var(--line); }
main h1 + h2, main .hero + h2 { border-top: 0; margin-top: 1em; }
main h3 { font-size: 1.1rem; margin: 1.6em 0 .4em; }
code { background: var(--code-bg); padding: .1em .35em; border-radius: 4px; font: .9em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
pre { background: var(--pre-bg); color: var(--pre-text); padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); overflow-x: auto; }
pre code { background: none; padding: 0; color: inherit; overflow-wrap: normal; }
table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 15px; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: var(--panel); }
blockquote { margin: 1em 0; padding: 10px 16px; background: var(--warn-bg); border-left: 4px solid var(--warn-line); border-radius: 0 6px 6px 0; }
blockquote p { margin: .3em 0; }
li { margin: .25em 0; }
.hero { padding: 8px 0 8px; }
.hero h1 { font-size: 2.4rem; margin-bottom: .3em; }
.lead { font-size: 1.15rem; color: var(--text); max-width: 60em; }
.free { color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); }
.card:hover { border-color: var(--accent); text-decoration: none; }
.card span { color: var(--muted); font-size: 14px; }
main img, .shot { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
main img[alt*="phone"] { max-width: min(390px, 100%); }
.op { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 12px 0; scroll-margin-top: 64px; }
.op-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.op-head code { font-size: .95em; }
.op .scope { margin-left: auto; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.op table { font-size: 14px; }
.op td:first-child { white-space: nowrap; }
.op details { margin: .6em 0; }
.op summary { cursor: pointer; color: var(--accent); }
.op .sub { margin: .8em 0 0; font-weight: 600; }
.req { font-size: 12px; color: #c0392b; }
.m { display: inline-block; min-width: 58px; text-align: center; font: 600 12px/1.8 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border-radius: 6px; color: #fff; }
.m-get { background: #1a7f37; } .m-post { background: #1f6feb; } .m-patch { background: #9a6700; } .m-put { background: #6e40c9; } .m-delete { background: #cf222e; }
.api-index { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 20px; font-size: 14px; }
.api-index div { margin-bottom: 10px; }
.api-index a { display: block; color: var(--text); padding: 1px 0; overflow-wrap: anywhere; }
.api-index a b { color: var(--accent); }
.api-index .m { min-width: 50px; font-size: 11px; margin-right: 4px; }
h3[id^="tag-"] { scroll-margin-top: 64px; }
footer { color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); margin-top: 48px; padding-top: 16px; }
@media (max-width: 800px) {
  .top { padding: 10px 16px; }
  .menu { display: inline-block; }
  .top .gh { display: none; }
  .top .suggest { padding: 2px 10px; font-size: 13px; }
  .top .suggest .long { display: none; }
  .wrap { grid-template-columns: 1fr; }
  nav.side { display: none; position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 16px 12px; }
  body.open nav.side { display: block; }
  main { padding: 20px 16px 48px; }
  main h1, .hero h1 { font-size: 1.7rem; }
}

/* ---- 2.2.2 home page: a landing page without the docs menu (the menu button still opens it on a phone) ---- */
:root { --navy: #0f2a4f; --teal: #2bb9c4; --grad: linear-gradient(135deg, #1b68b8 0%, #2bb9c4 100%); }
/* a soft teal glow behind the top of the page */
body.home { background: radial-gradient(60% 520px at 50% 0, color-mix(in srgb, var(--teal) 16%, transparent), transparent) no-repeat, var(--bg); }
.home .top { background: transparent; backdrop-filter: blur(8px); }
.home .wrap { display: block; max-width: none; }
.home nav.side { display: none; }
.home main { max-width: 1120px; margin: 0 auto; padding: 0 24px 56px; }
/* buttons keep the logo's blue in both themes, so white text always reads */
.home .button:not(.secondary):not(.ghost) { background: #1b68b8; }
.button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.button.ghost:hover { color: var(--text); border-color: var(--muted); }
.h-hero { text-align: center; padding: 56px 0 8px; position: relative; }
.h-eyebrow { display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--accent);
  background: var(--accent-soft); border-radius: 999px; padding: 4px 14px; margin: 0 0 18px; }
.h-hero h1 { font-size: clamp(2.1rem, 5vw, 3.6rem); line-height: 1.08; letter-spacing: -.02em; margin: 0 auto 18px; max-width: 16em; text-wrap: balance; }
.h-hero h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.h-sub { font-size: clamp(1.05rem, 2vw, 1.25rem); color: var(--muted); max-width: 40em; margin: 0 auto 26px; text-wrap: pretty; }
.h-cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 0 8px; }
.h-cta .button { padding: 11px 22px; }
.h-shot { display: block; margin: 40px auto 0; max-width: 1040px; }
.h-shot img { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid var(--line);
  box-shadow: 0 24px 60px -20px rgba(15, 42, 79, .35), 0 4px 14px rgba(15, 42, 79, .08); }
.h-sec { padding: 64px 0 0; }
.h-sec > h2 { border: 0; margin: 0 0 6px; padding: 0; font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: -.01em; text-align: center; }
.h-lead { text-align: center; color: var(--muted); margin: 0 auto 28px; max-width: 40em; }
.feats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.feat { border: 1px solid var(--line); border-radius: 12px; padding: 20px; background: var(--panel); }
.feat h3 { margin: 12px 0 4px; font-size: 1.05rem; }
.feat p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.ico { width: 40px; height: 40px; padding: 8px; border-radius: 10px; color: #fff; background: var(--grad); flex: none; }
.pills { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.pills li { margin: 0; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: 15px; background: var(--bg); }
.trust { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 24px; }
.trust-item { display: flex; gap: 14px; align-items: flex-start; padding: 4px; }
.trust-item h3 { margin: 2px 0 4px; font-size: 1.05rem; }
.trust-item p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
.h-more { text-align: center; margin: 20px 0 0; }
.h-install pre { max-width: 820px; margin: 0 auto; text-align: left; }
.h-docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 4px 24px; }
.h-docs a { display: block; padding: 10px 12px; border-radius: 8px; color: var(--text); }
.h-docs a:hover { background: var(--panel); text-decoration: none; }
.h-docs b { display: block; color: var(--accent); }
.h-docs span { display: block; color: var(--muted); font-size: 14px; line-height: 1.45; }
.h-ideas { text-align: center; padding-bottom: 8px; }
.h-ideas .free { max-width: 40em; margin: 12px auto 0; font-size: 14px; }
.home footer { text-align: center; }
@media (max-width: 800px) {
  .home main { padding: 0 16px 40px; }
  .h-hero { padding-top: 32px; }
  .h-sec { padding-top: 48px; }
  body.home.open nav.side { display: block; }
}
@media (max-width: 560px) {
  .feat { display: grid; grid-template-columns: 40px 1fr; column-gap: 14px; padding: 16px; }
  .feat .ico { grid-row: span 2; }
  .feat h3 { margin: 0 0 2px; }
  .h-cta .button { flex: 1 1 100%; text-align: center; }
}
/* the dashboard picture in dark mode is the app's dark theme */
.h-shot .on-dark { display: none; }
@media (prefers-color-scheme: dark) { .h-shot .on-light { display: none; } .h-shot .on-dark { display: block; } }
</style>
</head>
<body class="{{body_class}}">
<header class="top">
  <a class="brand" href="index.html"{{home_current}} aria-label="MSP Align home"><img class="on-light" src="logo.png" alt="MSP Align" width="1032" height="277"><img class="on-dark" src="logo-dark.png" alt="MSP Align" width="1032" height="277"></a>
  <span class="spacer"></span>
  <a class="suggest" href="{{suggest}}">Suggest<span class="long"> a feature</span></a>
  <a class="gh" href="install.html">Docs</a>
  <a class="gh" href="{{repo}}">GitHub</a>
  <button class="menu" type="button" onclick="document.body.classList.toggle('open')" aria-label="Menu">Menu</button>
</header>
<div class="wrap">
  <nav class="side" aria-label="Documentation">{{nav}}</nav>
  <main>
{{body}}
    <footer>MSP Align {{version}} · <a href="{{edit}}">Edit this page on GitHub</a> · <a href="{{suggest}}">Suggest a feature</a> · <a href="license.html">AGPL-3.0-or-later</a></footer>
  </main>
</div>
</body>
</html>
