# MSP Align (Docker): the site on port 80. HTTPS is handled by the reverse proxy in front (Caddy in
# compose.caddy.yaml, or your own), which must send X-Forwarded-For and X-Forwarded-Proto; its address goes in
# ALIGN_TRUSTED_PROXIES. The hardening below is kept in step with the one install.sh writes on a dedicated server.
# Only public/ is served (the app's code, config and data are outside it); .htaccess files are ignored
# (AllowOverride None) and dot files refused. Request bodies are 10 MB at most except on the three upload URLs below.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
LimitRequestBody 10485760
Timeout 60
GracefulShutdownTimeout 20
Header always unset X-Powered-By

# HSTS: the app sends it itself when the request came over HTTPS through a trusted proxy

# Keep secret links (calendar feeds, portal invites, onboarding and contract signing links) out of the access log
SetEnvIf Request_URI "^/ics/" align_secret_url
SetEnvIf Request_URI "^/portal/invite/" align_secret_url
SetEnvIf Request_URI "^/portal/welcome/" align_secret_url
SetEnvIf Request_URI "^/portal/sign/" align_secret_url
# ...and out of the Referer field (access log "combined" format, and the ", referer:" Apache adds to error lines):
# a page cached from before 2.2.1 (they now send no Referer) loads its scripts, styles and images with its whole
# URL, token included. The token part is cut from the header instead of leaving those requests out of the log, so
# a forged Referer can't hide a request from the log either.
RequestHeader edit Referer "(?i)^(https?://[^/]+/(?:ics|portal/(?:invite|welcome|sign))/).*$" "$1(hidden)"
# Health checks from inside the container stay out of the log too
SetEnvIf Remote_Addr "^127\.0\.0\.1$" align_local
# REST API: make sure "Authorization: Bearer <key>" reaches PHP
SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

<VirtualHost *:80>
    DocumentRoot /opt/msp-align/public
    <Directory /opt/msp-align/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    <Directory /opt/msp-align/public/assets>
        FallbackResource disabled
        Header set Cache-Control "public, max-age=2592000"
        Header always set X-Content-Type-Options "nosniff"
    </Directory>
    <Directory /opt/msp-align/public/vendor>
        Header set Cache-Control "public, max-age=2592000"
        Header always set X-Content-Type-Options "nosniff"
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Restoring a backup from Settings -> Updates & backups: large uploads on that one URL only, written to the data volume
    <Location "/settings/system/upload">
        LimitRequestBody 2147483647
        <IfModule php_module>
            php_value upload_max_filesize 2000M
            php_value post_max_size 2000M
            php_value max_input_time 1800
            php_value max_execution_time 1800
            php_admin_value upload_tmp_dir /var/lib/msp-align/restore
        </IfModule>
    </Location>

    # Settings -> Branding: a logo and two sign-in backgrounds can come in one save (2 + 8 + 8 MB)
    <Location "/settings/branding">
        LimitRequestBody 31457280
        <IfModule php_module>
            php_value post_max_size 24M
        </IfModule>
    </Location>

    # Onboarding -> Contracts: a contract PDF (signed, to check, or a template's own) can be up to 25 MB, and a
    # template export with its PDF inside up to 35 MB (2.2)
    <LocationMatch "^/contracts/(upload|verify|templates|templates/import|templates/[0-9]+/pdf)$">
        LimitRequestBody 41943040
        <IfModule php_module>
            php_value upload_max_filesize 36M
            php_value post_max_size 38M
        </IfModule>
    </LocationMatch>

    ErrorLog /var/log/apache2/msp-align-error.log
    CustomLog /var/log/apache2/msp-align-access.log combined "expr=-z reqenv('align_secret_url') && -z reqenv('align_local')"
</VirtualHost>
